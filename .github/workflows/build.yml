name: Build Java ME MIDlet

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
s  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Create Stubs and Compile MIDlet
        run: |
          # 1. Create stub directories inside src/
          mkdir -p src/javax/microedition/midlet src/javax/microedition/lcdui build/classes build/jar

          # 2. Write MIDlet stub
          cat << 'EOF' > src/javax/microedition/midlet/MIDlet.java
          package javax.microedition.midlet;
          public abstract class MIDlet {
              public MIDlet() {}
              protected abstract void startApp();
              protected abstract void pauseApp();
              protected abstract void destroyApp(boolean unconditional);
              public final void notifyDestroyed() {}
          }
          EOF

          # 3. Write LCDUI stubs
          cat << 'EOF' > src/javax/microedition/lcdui/Displayable.java
          package javax.microedition.lcdui;
          public class Displayable {}
          EOF

          cat << 'EOF' > src/javax/microedition/lcdui/Command.java
          package javax.microedition.lcdui;
          public class Command {
              public static final int SCREEN = 1;
              public static final int EXIT = 2;
              public Command(String label, int commandType, int priority) {}
          }
          EOF

          cat << 'EOF' > src/javax/microedition/lcdui/CommandListener.java
          package javax.microedition.lcdui;
          public interface CommandListener {
              void commandAction(Command c, Displayable d);
          }
          EOF

          cat << 'EOF' > src/javax/microedition/lcdui/Form.java
          package javax.microedition.lcdui;
          public class Form extends Displayable {
              public Form(String title) {}
              public void append(String text) {}
              public void addCommand(Command cmd) {}
              public void setCommandListener(CommandListener l) {}
          }
          EOF

          cat << 'EOF' > src/javax/microedition/lcdui/Display.java
          package javax.microedition.lcdui;
          import javax.microedition.midlet.MIDlet;
          public class Display {
              public static Display getDisplay(MIDlet m) { return null; }
              public void setCurrent(Displayable d) {}
          }
          EOF

          # 4. Compile all Java files together using Java 8 rt.jar as bootclasspath
          javac -source 1.3 -target 1.3 -bootclasspath $JAVA_HOME/jre/lib/rt.jar -d build/classes $(find src -name "*.java")

          # 5. Create final JAR package
          cd build/classes
          jar cfm ../jar/LagApp.jar ../../src/META-INF/MANIFEST.MF .
          cd ../..

          # 6. Calculate JAR size and update JAD file
          JAR_SIZE=$(wc -c < build/jar/LagApp.jar)
          cp LagApp.jad build/jar/LagApp.jad
          echo "MIDlet-Jar-Size: $JAR_SIZE" >> build/jar/LagApp.jad

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LagApp-Files
          path: build/jar/
          
