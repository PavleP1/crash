name: Build Java ME MIDlet

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Compile and Package MIDlet
        run: |
          mkdir -p build/classes build/jar
          
          # Download CLDC/MIDP API stubs for compilation
          wget -O cldc_midp.jar https://github.com/nikita-volkov/j2me-stubs/raw/master/cldc_midp.jar || \
          curl -L -o cldc_midp.jar https://raw.githubusercontent.com/woody2/j2me-stubs/master/cldc_midp.jar || true
          
          # Fallback check if stubs need manual generation or standard javac with bootclasspath
          javac -source 1.3 -target 1.3 -bootclasspath cldc_midp.jar -d build/classes src/LagApp.java
          
          # Create JAR package
          cd build/classes
          jar cfm ../jar/LagApp.jar ../../src/META-INF/MANIFEST.MF .
          cd ../..
          
          # Calculate JAR size and update JAD file
          JAR_SIZE=$(wc -c < build/jar/LagApp.jar)
          cp LagApp.jad build/jar/LagApp.jad
          echo "MIDlet-Jar-Size: $JAR_SIZE" >> build/jar/LagApp.jad

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LagApp-Files
          path: build/jar/
          
